<title>Handshake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header over a routed <main>. Home opens on a dark spotlight band, then light sections.
   Views cross-fade; the product card morphs between shop and product pages. */
:root {
  --paper: #f3f4f6;
  --surface: #ffffff;
  --ink: #101217;
  --muted: #5d6471;
  --line: #dde0e6;
  --signal: #2b47ff;
  --signal-ink: #ffffff;
  --night: #07080b;
  --night-ink: #f2f3f5;
  --night-muted: #9aa1ad;
  --night-line: #1d2129;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0c0d11; --surface: #15171d; --ink: #eef0f3; --muted: #9aa1ad;
    --line: #242833; --signal: #6077ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0c0d11; --surface: #15171d; --ink: #eef0f3; --muted: #9aa1ad;
  --line: #242833; --signal: #6077ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--display); line-height: 1; letter-spacing: -0.025em; text-wrap: balance; margin: 0; font-weight: 800; }
p { margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.label { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); view-transition-name: top; }
.top .wrap { display: flex; align-items: center; gap: 20px; height: 64px; }
.logo { font: 800 21px/1 var(--display); text-decoration: none; letter-spacing: -0.035em; display: flex; align-items: center; gap: 9px; }
.logo .mark { width: 26px; height: 26px; border-radius: 8px; background: var(--ink); color: var(--paper); display: grid; place-items: center; }
.logo .mark svg { width: 16px; height: 16px; }
nav.links { display: flex; gap: 2px; margin-left: auto; }
nav.links a { text-decoration: none; font-weight: 500; font-size: 15px; padding: 8px 14px; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
nav.links a:hover { color: var(--ink); }
nav.links a[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.cart-btn { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 9px 9px 9px 16px; font-weight: 600; font-size: 15px; text-decoration: none; transition: transform .25s var(--ease); }
.cart-btn:hover { transform: translateY(-1px); }
.cart-btn .count { font: 500 12px/1 var(--mono); background: var(--paper); color: var(--ink); border-radius: 999px; min-width: 22px; height: 22px; display: grid; place-items: center; padding: 0 6px; transition: transform .3s var(--ease); }
.cart-btn .count.bump { transform: scale(1.35); }
@media (max-width: 640px) { nav.links a.hide-sm { display: none; } .top .wrap { gap: 10px; } }

/* View transitions */
main { min-height: 70vh; }
::view-transition-old(root) { animation: vt-out .2s var(--ease) both; }
::view-transition-new(root) { animation: vt-in .42s var(--ease) both; }
::view-transition-group(*) { animation-duration: .55s; animation-timing-function: var(--ease); }
@keyframes vt-out { to { opacity: 0; transform: translateY(-8px); filter: blur(2px); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(14px); filter: blur(2px); } }
.fallback-in { animation: vt-in .42s var(--ease) both; }

/* Buttons */
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 15px 24px; font-weight: 600; text-decoration: none; border: 1px solid transparent; transition: transform .25s var(--ease), background .2s, box-shadow .25s, border-color .2s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--signal); color: var(--signal-ink); box-shadow: 0 12px 28px -14px var(--signal); }
.btn.primary:hover { transform: translateY(-2px); box-shadow: 0 18px 34px -14px var(--signal); }
.btn.ghost { border-color: var(--line); background: var(--surface); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.on-night { border-color: rgba(255,255,255,.18); color: var(--night-ink); background: rgba(255,255,255,.04); }
.btn.on-night:hover { border-color: rgba(255,255,255,.5); }
.btn.full { width: 100%; }
.btn .arrow { transition: transform .25s var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }

/* The card */
.card { --w: 340px; --c-bg: #111; --c-ink: #fff; --c-sheen: none; width: min(var(--w), 100%); max-width: 100%; aspect-ratio: 85.6 / 53.98; border-radius: 4.6% / 7.3%; position: relative; overflow: hidden; color: var(--c-ink); background: var(--c-bg); padding: 7% 7.5%; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 0 0 1px rgba(255,255,255,.04) inset, 0 34px 60px -30px rgba(5,8,20,.6), 0 14px 26px -18px rgba(5,8,20,.4); }
.card::after { content: ""; position: absolute; inset: 0; background: var(--c-sheen); pointer-events: none; }
.card .c-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; position: relative; z-index: 1; }
.card .c-mark { font: 800 1.02em/1 var(--display); letter-spacing: -0.035em; overflow-wrap: anywhere; }
.card .c-logo { max-height: 2.2em; max-width: 45%; object-fit: contain; }
.card .c-wave { width: 1.5em; height: 1.5em; opacity: .8; flex: none; }
.card .c-body { position: relative; z-index: 1; }
.card .c-name { font: 600 1.38em/1.05 var(--display); letter-spacing: -0.025em; overflow-wrap: anywhere; }
.card .c-role { font: 500 .6em/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .68; margin-top: .5em; overflow-wrap: anywhere; }
.card.onyx { --c-bg: radial-gradient(130% 90% at 20% 0%, #24262c 0%, #0d0e11 55%, #060608 100%); --c-ink: #e8e9ec; --c-sheen: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.07) 48%, transparent 60%); }
.card.onyx .c-name, .card.onyx .c-mark { background: linear-gradient(180deg, #f4f5f7, #a9adb5); -webkit-background-clip: text; background-clip: text; color: transparent; }
.card.f-gloss { --c-sheen: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.28) 45%, transparent 58%), radial-gradient(120% 80% at 10% 0%, rgba(255,255,255,.22), transparent 55%); }
.card.f-matte { --c-sheen: radial-gradient(120% 90% at 15% 0%, rgba(255,255,255,.1), transparent 60%); }
.card.f-metal { --c-sheen: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px), linear-gradient(115deg, transparent 30%, rgba(255,255,255,.35) 46%, transparent 60%); }
.card-back { justify-content: center; align-items: center; gap: .6em; text-align: center; }
.card-back .c-wave { width: 3em; height: 3em; opacity: .9; }
.card-back .c-tap { font: 500 .6em/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; opacity: .6; }

/* Stack of cards for the pack */
.stack { position: relative; width: min(var(--w, 340px), 100%); max-width: 100%; }
.stack .card { --w: 100%; width: 100%; position: relative; z-index: 3; }
.stack .ghost-card { position: absolute; inset: 0; border-radius: 4.6% / 7.3%; background: var(--c-bg); transition: transform .5s var(--ease); }
.stack .ghost-card.g1 { transform: translate(5%, -7%) rotate(4deg); z-index: 2; filter: brightness(.82); }
.stack .ghost-card.g2 { transform: translate(10%, -14%) rotate(8deg); z-index: 1; filter: brightness(.66); }
.tile:hover .stack .g1 { transform: translate(7%, -10%) rotate(6deg); }
.tile:hover .stack .g2 { transform: translate(14%, -20%) rotate(11deg); }

/* Home: night hero */
.night { background: var(--night); color: var(--night-ink); position: relative; overflow: hidden; isolation: isolate; }
.night::before { content: ""; position: absolute; inset: -20% -10% auto auto; width: 70%; aspect-ratio: 1; background: radial-gradient(closest-side, rgba(96,119,255,.35), rgba(96,119,255,.08) 55%, transparent 72%); z-index: -1; }
.night::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--night-line) 1px, transparent 1px), linear-gradient(90deg, var(--night-line) 1px, transparent 1px); background-size: 56px 56px; mask-image: radial-gradient(70% 70% at 70% 40%, #000 10%, transparent 75%); -webkit-mask-image: radial-gradient(70% 70% at 70% 40%, #000 10%, transparent 75%); opacity: .55; z-index: -2; }
.hero { padding-block: clamp(56px, 9vw, 120px) clamp(56px, 8vw, 104px); display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; }
.hero > * { min-width: 0; }
.hero .label { color: var(--night-muted); display: inline-flex; gap: 10px; align-items: center; }
.hero .label .dot { width: 7px; height: 7px; border-radius: 50%; background: #5dd39e; box-shadow: 0 0 0 4px rgba(93,211,158,.18); }
.hero h1 { font-size: clamp(50px, 8vw, 112px); margin-top: 22px; line-height: .94; letter-spacing: -0.045em; }
.hero h1 .soft { color: transparent; -webkit-text-stroke: 1.5px rgba(242,243,245,.55); }
.hero p.lede { font-size: clamp(17px, 1.6vw, 20px); color: var(--night-muted); max-width: 44ch; margin: 26px 0 34px; }
.hero .fine { margin-top: 26px; display: flex; gap: 22px; flex-wrap: wrap; font-size: 14px; color: var(--night-muted); }
.hero .fine span { display: inline-flex; gap: 8px; align-items: center; }
.hero .fine svg { width: 16px; height: 16px; color: #5dd39e; }
.stage { position: relative; display: grid; place-items: center; min-height: 380px; perspective: 1400px; }
.float { width: min(380px, 78%); animation: float 7s ease-in-out infinite; transform-style: preserve-3d; position: relative; z-index: 2; }
.float .card { --w: 100%; font-size: clamp(12px, 1.5vw, 17px); transform: rotateY(-18deg) rotateX(12deg) rotateZ(-4deg); }
@keyframes float { 0%,100% { transform: translateY(0) rotateY(0); } 50% { transform: translateY(-14px) rotateY(6deg); } }
.stage .shadow { position: absolute; bottom: 8%; width: 60%; height: 34px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.7), transparent); filter: blur(6px); animation: shadow 7s ease-in-out infinite; }
@keyframes shadow { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(.86); opacity: .6; } }
.rings { position: absolute; left: 50%; top: 46%; width: 1px; height: 1px; pointer-events: none; z-index: 1; }
.rings span { position: absolute; left: -130px; top: -130px; width: 260px; height: 260px; border: 1px solid rgba(140,160,255,.5); border-radius: 50%; opacity: 0; animation: ring 3.6s var(--ease) infinite; }
.rings span:nth-child(2) { animation-delay: 1.2s; } .rings span:nth-child(3) { animation-delay: 2.4s; }
@keyframes ring { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.tag-float { position: absolute; z-index: 3; background: rgba(20,22,28,.78); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 14px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,.8); }
.tag-float b { display: block; font-weight: 600; color: var(--night-ink); }
.tag-float small { color: var(--night-muted); font-size: 12px; }
.tag-float .ico { width: 30px; height: 30px; border-radius: 9px; background: #5dd39e; color: #062016; display: grid; place-items: center; font-weight: 700; flex: none; }
.tag-float.t1 { left: 0; bottom: 2%; animation: float 7s ease-in-out infinite -2s; }
.tag-float.t2 { right: 0; top: 2%; animation: float 7s ease-in-out infinite -4.5s; }
.tag-float.t2 .ico { background: var(--signal); color: #fff; }
@media (max-width: 900px) { .hero { grid-template-columns: 1fr; } .stage { min-height: 300px; } .tag-float.t1 { left: 2%; } }
@media (max-width: 480px) { .tag-float { display: none; } }

/* Sections */
.section { padding-block: clamp(64px, 9vw, 112px); }
.section-head { display: grid; gap: 14px; margin-bottom: 40px; max-width: 640px; }
.section-head h2 { font-size: clamp(34px, 4.6vw, 56px); }
.section-head p { color: var(--muted); font-size: 18px; }
.section-head.row { max-width: none; display: flex; justify-content: space-between; align-items: end; gap: 20px; flex-wrap: wrap; }

/* Product tiles */
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.tile { text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 14px 14px 24px; display: flex; flex-direction: column; gap: 22px; transition: border-color .25s, transform .4s var(--ease), box-shadow .4s var(--ease); min-width: 0; position: relative; }
.tile:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); box-shadow: 0 30px 50px -36px rgba(10,14,30,.45); }
.tile .shot { border-radius: 16px; aspect-ratio: 4 / 3; display: grid; place-items: center; padding: 14%; position: relative; overflow: hidden; }
.tile .shot.s-onyx { background: radial-gradient(90% 80% at 50% 20%, #2a2d36, #0b0c10); }
.tile .shot.s-custom { background: conic-gradient(from 210deg at 50% 50%, #ffd8c2, #f5b4d0, #c9c3ff, #b6e3ff, #c8f2d8, #ffd8c2); }
.tile .shot.s-pack { background: radial-gradient(90% 80% at 50% 20%, #e4e8f2, #c7cede); }
.tile .card, .tile .stack { --w: 100%; font-size: clamp(9px, 1.1vw, 12px); transition: transform .5s var(--ease); }
.tile:hover .shot > .card { transform: rotate(-3deg) scale(1.04); }
.tile .body { padding: 0 10px; display: grid; gap: 10px; }
.tile .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tile h3 { font-size: 26px; }
.tile .price { font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .price small { color: var(--muted); font-size: 12px; }
.tile p { color: var(--muted); font-size: 15px; }
.tile .badge { position: absolute; top: 26px; left: 26px; z-index: 4; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; background: var(--surface); color: var(--ink); padding: 7px 10px; border-radius: 999px; box-shadow: 0 4px 14px -6px rgba(0,0,0,.4); }
.tile .go { margin-top: 4px; font-weight: 600; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; }
.tile .go .arrow { transition: transform .25s var(--ease); }
.tile:hover .go .arrow { transform: translateX(4px); }
@media (max-width: 900px) { .tiers { grid-template-columns: 1fr; max-width: 520px; } }

/* Specs + steps */
@media (max-width: 760px) { .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--line); }
.step { padding: 28px 28px 8px 0; min-width: 0; }
.step + .step { padding-left: 28px; border-left: 1px solid var(--line); }
.step .n { font: 500 12px/1 var(--mono); color: var(--signal); }
.step h3 { font-size: 24px; margin: 18px 0 10px; font-weight: 600; }
.step p { color: var(--muted); }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } .step + .step { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); } }

/* FAQ */
.faq { display: grid; grid-template-columns: .8fr 1.2fr; gap: 48px; }
.faq > * { min-width: 0; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { list-style: none; cursor: pointer; padding: 22px 0; font: 600 19px/1.3 var(--display); letter-spacing: -0.01em; display: flex; justify-content: space-between; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font: 400 24px/1 var(--body); color: var(--muted); transition: transform .3s var(--ease); }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { color: var(--muted); padding: 0 0 22px; max-width: 60ch; }
@media (max-width: 860px) { .faq { grid-template-columns: 1fr; gap: 8px; } }

/* CTA band */
.cta { background: var(--night); color: var(--night-ink); border-radius: 28px; padding: clamp(36px, 6vw, 72px); display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; position: relative; overflow: hidden; isolation: isolate; }
.cta::before { content: ""; position: absolute; right: -10%; top: -60%; width: 60%; aspect-ratio: 1; background: radial-gradient(closest-side, rgba(96,119,255,.4), transparent 70%); z-index: -1; }
.cta h2 { font-size: clamp(32px, 4.4vw, 54px); }
.cta p { color: var(--night-muted); margin-top: 14px; font-size: 18px; }
@media (max-width: 760px) { .cta { grid-template-columns: 1fr; } }

/* Shop page */
.page-head { padding-block: clamp(40px, 6vw, 72px) 32px; display: grid; gap: 16px; }
.page-head h1 { font-size: clamp(44px, 7vw, 84px); letter-spacing: -0.04em; }
.page-head p { color: var(--muted); font-size: 18px; max-width: 52ch; }
.compare { margin-top: 56px; overflow-x: auto; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); }
.compare table { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 15px; }
.compare th, .compare td { padding: 16px 22px; text-align: left; border-bottom: 1px solid var(--line); }
.compare tr:last-child td { border-bottom: 0; }
.compare thead th { font: 600 18px/1 var(--display); letter-spacing: -0.01em; }
.compare tbody th { font-weight: 500; color: var(--muted); }
.compare td.yes { color: var(--ink); } .compare td.no { color: var(--muted); }

/* Product page */
.crumbs { padding-block: 26px 0; font-size: 14px; color: var(--muted); display: flex; gap: 8px; }
.crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--ink); }
.pdp { display: grid; grid-template-columns: 1.15fr .85fr; gap: 56px; padding-block: 22px 96px; align-items: start; }
.pdp > * { min-width: 0; }
.viewer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 86px); border-radius: 28px; padding: clamp(36px, 7vw, 88px) clamp(20px, 4vw, 48px) 28px; display: grid; place-items: center; gap: 28px; perspective: 1400px; overflow: hidden; isolation: isolate; }
.viewer.v-onyx, .viewer.v-pack { background: radial-gradient(100% 80% at 50% 10%, #262932, #08090c 80%); }
.viewer.v-custom { background: radial-gradient(100% 80% at 50% 10%, color-mix(in srgb, var(--pick, #2b47ff) 30%, #fff), color-mix(in srgb, var(--pick, #2b47ff) 12%, #e9ebf0) 80%); }
.viewer .flip { --w: 460px; width: min(var(--w), 100%); max-width: 100%; position: relative; transform-style: preserve-3d; transition: transform .8s var(--ease); font-size: clamp(11px, 2.6vw, 19px); }
.viewer .flip.flipped { transform: rotateY(180deg); }
.viewer .flip > .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.viewer .flip > .face.back { position: absolute; inset: 0; transform: rotateY(180deg); }
.viewer .flip .card, .viewer .flip .stack { --w: 100%; width: 100%; }
.viewer .tilt { transition: transform .5s var(--ease); transform-style: preserve-3d; width: min(460px, 100%); display: grid; place-items: center; }
.viewer .tools { display: flex; gap: 8px; }
.chip-btn { border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; backdrop-filter: blur(8px); transition: background .2s; }
.chip-btn:hover { background: rgba(255,255,255,.16); }
.v-custom .chip-btn { border-color: rgba(0,0,0,.12); background: rgba(255,255,255,.6); color: #101217; }
.buy .label { display: block; }
.buy h1 { font-size: clamp(40px, 5vw, 60px); margin: 14px 0 12px; letter-spacing: -0.04em; }
.price-lg { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.price-lg small { font-size: 13px; color: var(--muted); }
.buy .desc { color: var(--muted); margin: 20px 0 30px; font-size: 17px; }
.field { display: grid; gap: 10px; margin-bottom: 22px; }
.field > label, .field > .flabel { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; }
.field > .flabel span, .field > label span { color: var(--muted); font-weight: 400; }
.field input[type="text"], .field textarea { width: 100%; padding: 13px 15px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; transition: border-color .2s, box-shadow .2s; resize: vertical; }
.field input[type="text"]:focus, .field textarea:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--signal) 18%, transparent); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two > * { min-width: 0; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 0; padding: 0; background: var(--sw); box-shadow: 0 0 0 1px rgba(0,0,0,.12) inset; position: relative; transition: transform .2s var(--ease); }
.swatch:hover { transform: scale(1.08); }
.swatch[aria-pressed="true"]::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--ink); }
.swatch.picker { background: conic-gradient(#ff5a5a, #ffd25a, #5aff8c, #5ad7ff, #8a5aff, #ff5ad2, #ff5a5a); overflow: hidden; }
.swatch.picker input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px 8px; border-radius: 10px; font-weight: 500; font-size: 14px; color: var(--muted); transition: background .25s, color .25s; display: grid; gap: 2px; }
.seg button small { font: 400 11px/1.2 var(--mono); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button[aria-pressed="true"] small { color: color-mix(in srgb, var(--paper) 70%, transparent); }
.upload { display: flex; align-items: center; gap: 14px; border: 1px dashed var(--line); border-radius: 14px; padding: 14px; background: var(--surface); transition: border-color .2s; }
.upload:hover, .upload.drag { border-color: var(--signal); }
.upload .thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--paper); display: grid; place-items: center; overflow: hidden; flex: none; color: var(--muted); }
.upload .thumb img { width: 100%; height: 100%; object-fit: contain; }
.upload .txt { flex: 1; min-width: 0; font-size: 14px; }
.upload .txt b { display: block; font-weight: 600; }
.upload .txt span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.upload input { display: none; }
.upload label { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--signal); white-space: nowrap; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); flex: none; }
.qty button { width: 44px; height: 48px; border: 0; background: none; font-size: 18px; border-radius: 999px; }
.qty output { min-width: 28px; text-align: center; font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
.buy-row { display: flex; gap: 12px; align-items: center; margin-top: 10px; }
.buy-row .btn { flex: 1; }
.facts { margin-top: 36px; border-top: 1px solid var(--line); }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 13px; }
@media (max-width: 900px) { .pdp { grid-template-columns: 1fr; gap: 32px; } .viewer { position: static; } }

/* Cart */
.cart { display: grid; grid-template-columns: 1fr 380px; gap: 48px; padding-block: 0 96px; align-items: start; }
.cart > * { min-width: 0; }
.line { display: grid; grid-template-columns: 132px 1fr auto; gap: 22px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); }
.line:first-child { border-top: 1px solid var(--line); }
.line > * { min-width: 0; }
.line .card, .line .stack { --w: 132px; font-size: 6.5px; }
.line h3 { font-size: 20px; font-weight: 600; }

.line .right { display: grid; justify-items: end; gap: 10px; }
.line .amt { font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
.link-btn { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
.link-btn:hover { color: var(--ink); }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 26px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 86px); }
.summary h3 { font-size: 22px; font-weight: 600; margin-bottom: 14px; }
.summary .row { display: flex; justify-content: space-between; padding: 9px 0; font-variant-numeric: tabular-nums; }
.summary .row.total { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 18px; font-weight: 600; font-size: 19px; }
.meter { height: 6px; border-radius: 6px; background: var(--paper); overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--signal); border-radius: 6px; transition: width .6s var(--ease); }
.summary .note { font-size: 13px; color: var(--muted); margin-top: 14px; }
.empty { text-align: center; padding-block: 40px 120px; display: grid; justify-items: center; gap: 18px; }

@media (max-width: 900px) { .cart { grid-template-columns: 1fr; } .summary { position: static; } .line { grid-template-columns: 92px 1fr; } .line .card, .line .stack { --w: 92px; font-size: 4.6px; } .line .right { grid-column: 1 / -1; grid-auto-flow: column; justify-content: space-between; align-items: center; } }

/* Toast + footer */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, calc(100% + 48px)); visibility: hidden; background: var(--ink); color: var(--paper); padding: 12px 14px 12px 18px; border-radius: 999px; font-weight: 500; transition: transform .5s var(--ease), visibility .5s; z-index: 30; display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 20px 40px -20px rgba(0,0,0,.5); }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast a { color: var(--ink); background: var(--paper); text-decoration: none; font-weight: 600; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  .fallback-in, .rings span, .float, .stage .shadow, .tag-float { animation: none !important; }
  .viewer .flip { transition: none; }
}

<header class="top">

      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 8.5a6 6 0 0 1 0 7"/><path d="M11 6a10 10 0 0 1 0 12"/><path d="M15 3.5a14 14 0 0 1 0 17"/></svg></span>
      Handshake

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  // Placeholder prices until the owner confirms real ones.
  // Pack size is a placeholder until the owner confirms how many cards the pack includes.
  const PACKS = [
    { size: 10, price: 79 },
  ];
  const PRODUCTS = {
    onyx:   { id: "onyx",   name: "Onyx",          price: 19, kicker: "Matte black, metal-look print", blurb: "Deep matte black with a soft brushed-silver print. One card, your name, nothing extra. The one most people start with.", weight: "5 g" },
    custom: { id: "custom", name: "Customized",    price: 29, kicker: "Your colors, your logo",         blurb: "Pick any color, choose a finish and add your own logo. The preview updates as you go, and that's what we print.", weight: "5 to 18 g" },
    pack:   { id: "pack",   name: "Business Pack", price: PACKS[0].price, kicker: "Matching cards for a team",  blurb: "Matching cards for your whole team with your company logo on every one. Add everyone's name and we print and program each card.", weight: "5 g each" },
  };
  const COLORS = ["#2b47ff", "#0e0f12", "#f4f1ea", "#e8483b", "#1f7a5a", "#f2b630", "#8e6cf0", "#ff8fb1"];
  const FINISHES = { matte: { label: "Matte", add: 0 }, gloss: { label: "Gloss", add: 0 }, metal: { label: "Metal", add: 10 } };

  const money = n => "$" + n.toFixed(2).replace(/\.00$/, "");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const WAVE = '<svg class="c-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 0 7"/><path d="M10 6a10 10 0 0 1 0 12"/><path d="M14 3.5a14 14 0 0 1 0 17"/></svg>';
  const ARROW = '<span class="arrow" aria-hidden="true">&rarr;</span>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

  function inkFor(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    const L = c => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
    return .2126 * L(r) + .7152 * L(g) + .0722 * L(b) > .4 ? "#14161b" : "#ffffff";
  }
  const shade = (hex, amt) => {
    const n = parseInt(hex.slice(1), 16);
    const f = c => Math.max(0, Math.min(255, Math.round(c + amt))).toString(16).padStart(2, "0");
    return "#" + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255);
  };

  let cart = [];
  try { cart = JSON.parse(localStorage.getItem("handshake-cart") || "[]").filter(l => PRODUCTS[l.id]); } catch (e) { cart = []; }
  const save = () => {
    try { localStorage.setItem("handshake-cart", JSON.stringify(cart)); }
    catch (e) { try { localStorage.setItem("handshake-cart", JSON.stringify(cart.map(l => ({ ...l, logo: null })))); } catch (e2) {} }
  };

  const draft = {
    name: "Alex Rivera", role: "Product Designer",
    color: "#2b47ff", finish: "gloss", logo: null, logoName: "",
    company: "Northwind Studio", packSize: 10,
    team: "Alex Rivera\nSam Okafor\nPriya Shah\nJordan Lee",
  };

  // Card markup. o: { kind, name, role, color, finish, logo, company, back }
  function card(o) {
    let cls = "card", style = "", mark = "Handshake";
    if (o.kind === "onyx") cls += " onyx";
    else {
      cls += " f-" + (o.finish || "gloss");
      const c = o.color || "#2b47ff";
      style = `--c-bg:linear-gradient(150deg, ${shade(c, 18)}, ${c} 55%, ${shade(c, -22)});--c-ink:${inkFor(c)}`;
      if (o.kind === "pack" && o.company) mark = o.company;
    }
    const brand = o.logo ? `<img class="c-logo" src="${o.logo}" alt="">` : `<span class="c-mark">${esc(mark)}</span>`;
    if (o.back) return `<div class="${cls} card-back" style="${style}">${WAVE}<span class="c-tap">Tap to connect</span></div>`;
    return `<div class="${cls}" style="${style}" role="img" aria-label="Card preview for ${esc(o.name)}">
      <div class="c-top">${brand}${WAVE}</div>
      <div class="c-body"><div class="c-name">${esc(o.name)}</div><div class="c-role">${esc(o.role)}</div></div>
    </div>`;
  }
  function stack(o, vt) {
    const c = o.color || "#2b47ff";
    const bg = `linear-gradient(150deg, ${shade(c, 18)}, ${c} 55%, ${shade(c, -22)})`;
    return `<div class="stack"${vt ? ` style="view-transition-name:${vt}"` : ""}><span class="ghost-card g2" style="--c-bg:${bg}"></span><span class="ghost-card g1" style="--c-bg:${bg}"></span>${card(o)}</div>`;
  }
  const packCard = () => ({ kind: "pack", name: teamNames()[0] || "Team member", role: draft.company, color: draft.color, finish: draft.finish, logo: draft.logo, company: draft.company });
  const customCard = () => ({ kind: "custom", name: draft.name, role: draft.role, color: draft.color, finish: draft.finish, logo: draft.logo });
  const onyxCard = () => ({ kind: "onyx", name: draft.name, role: draft.role });
  const teamNames = () => draft.team.split("\n").map(s => s.trim()).filter(Boolean);
  const wrapVT = (html, vt) => `<div style="view-transition-name:${vt};width:100%;display:grid;place-items:center">${html}</div>`;

  function tiles(withVT) {
    const vt = id => withVT ? "card-" + id : null;
    const t = (id, shot, extra = "") => {
      const p = PRODUCTS[id];
      const price = id === "pack" ? `<span class="price">${money(PACKS[0].price)}</span>` : `<span class="price">${money(p.price)}</span>`;
      return `<a class="tile" href="#card-${id}">${extra}
        <div class="shot s-${id}">${shot}</div>
        <div class="body">
          <div class="meta"><h3>${p.name}</h3>${price}</div>
          <p>${p.kicker}.</p>
          <span class="go">View ${p.name} ${ARROW}</span>
        </div></a>`;
    };
    const onyx = card(onyxCard());
    const custom = card({ kind: "custom", name: draft.name, role: draft.role, color: "#2b47ff", finish: "gloss" });
    return `<div class="tiers">
      ${t("onyx", withVT ? wrapVT(onyx, vt("onyx")) : onyx, `<span class="badge">Most popular</span>`)}
      ${t("custom", withVT ? wrapVT(custom, vt("custom")) : custom)}
      ${t("pack", stack({ kind: "pack", name: "Sam Okafor", role: "Northwind Studio", color: "#1f2a44", finish: "matte", company: "Northwind Studio" }, vt("pack")))}
    </div>`;
  }

  const views = {
    home() {
      return `
      <section class="night">
        <div class="wrap hero">
          <div>
            <span class="label"><span class="dot"></span>NFC business cards</span>
            <h1>Meet once.<br><span class="soft">Stay</span> connected.</h1>
            <p class="lede">Tap a Handshake card on any phone and your contact details, socials and portfolio open right away. They don't need an app, and you can change your details without reprinting.</p>
            <div class="actions">
              <a class="btn primary" href="#shop">Shop cards ${ARROW}</a>
              <a class="btn on-night" href="#card-onyx">See Onyx</a>
            </div>
            <div class="fine">
              <span>${CHECK}No app needed</span>
              <span>${CHECK}iPhone and Android</span>
              <span>${CHECK}Ships in 3 to 5 days</span>
            </div>
          </div>
          <div class="stage" aria-hidden="true">
            <div class="rings"><span></span><span></span><span></span></div>
            <div class="float" style="view-transition-name:card-onyx">${card(onyxCard())}</div>
            <div class="shadow"></div>
            <div class="tag-float t1"><span class="ico">+</span><div><b>Contact saved</b><small>Alex Rivera, just now</small></div></div>
            <div class="tag-float t2"><span class="ico">in</span><div><b>Profile opened</b><small>No app required</small></div></div>
          </div>
        </div>
      </section>

      <section class="wrap section">
        <div class="section-head row">
          <div style="display:grid;gap:14px;max-width:620px"><span class="label">The lineup</span><h2>Three cards. Pick yours.</h2></div>
          <a class="btn ghost" href="#shop">Compare all ${ARROW}</a>
        </div>
        ${tiles(false)}
      </section>

      <section class="wrap section">
        <div class="section-head"><span class="label">How it works</span><h2>From box to first tap in minutes.</h2></div>
        <div class="steps">
          <div class="step"><span class="n">Step 1</span><h3>Choose your card</h3><p>Go with Onyx, design your own with Customized, or get a Business Pack for your team.</p></div>
          <div class="step"><span class="n">Step 2</span><h3>Set up your profile</h3><p>When your card arrives, link it to a profile page with your contact details, socials and files.</p></div>
          <div class="step"><span class="n">Step 3</span><h3>Tap to share</h3><p>Hold the card near the top of any NFC phone and your profile opens in their browser.</p></div>
        </div>
      </section>

      <section class="wrap" style="padding-bottom:clamp(64px,9vw,112px)">
        <div class="faq">
          <div class="section-head" style="margin:0"><span class="label">Questions</span><h2>Good to know.</h2></div>
          <div>
            <details open><summary>Does the other person need an app?</summary><p>No. iPhones (XS and newer) and most Android phones read NFC on their own. Your profile opens in their web browser.</p></details>
            <details><summary>Can I change my details after it's printed?</summary><p>Yes. The card links to your profile, so when you update the profile, every tap shows the new version.</p></details>
                        <details><summary>How does the Business Pack work?</summary><p>You get ${PACKS[0].size} matching cards. Upload your logo and list your team's names. We print and program a card for each person.</p></details>
          </div>
        </div>
      </section>

      <section class="wrap" style="padding-bottom:clamp(64px,9vw,112px)">
        <div class="cta">
          <div><h2>Your next intro starts with a tap.</h2><p>Onyx starts at ${money(PRODUCTS.onyx.price)}, and shipping is free on orders over $75.</p></div>
          <a class="btn primary" href="#shop">Shop cards ${ARROW}</a>
        </div>
      </section>`;
    },

    shop() {
      const y = t => `<td class="yes">${t}</td>`, n = t => `<td class="no">${t}</td>`;
      return `
      <section class="wrap page-head"><span class="label">3 cards</span><h1>Shop cards</h1><p>Every card has an NFC chip and comes with a free profile page you can edit any time.</p></section>
      <section class="wrap" style="padding-bottom:96px">
        ${tiles(true)}
        <div class="compare">
          <table>
            <thead><tr><th scope="col"><span class="label">Compare</span></th><th scope="col">Onyx</th><th scope="col">Customized</th><th scope="col">Business Pack</th></tr></thead>
            <tbody>
              <tr><th scope="row">Price</th>${y(money(PRODUCTS.onyx.price))}${y(money(PRODUCTS.custom.price))}${y(money(PACKS[0].price))}</tr>
              <tr><th scope="row">Cards</th>${y("1")}${y("1")}${y(String(PACKS[0].size))}</tr>
              <tr><th scope="row">Card color</th>${y("Matte black")}${y("Any color")}${y("Any color")}</tr>
              <tr><th scope="row">Your logo</th>${n("No")}${y("Yes")}${y("Yes, on every card")}</tr>
              <tr><th scope="row">Finish</th>${y("Matte")}${y("Matte, gloss or metal")}${y("Matte, gloss or metal")}</tr>
              <tr><th scope="row">Names printed</th>${y("Yours")}${y("Yours")}${y("One per team member")}</tr>
            </tbody>
          </table>
        </div>
      </section>`;
    },

    product(id) {
      const p = PRODUCTS[id]; if (!p) return views.shop();
      let preview, fields, priceHtml, facts;
      if (id === "onyx") {
        preview = card(onyxCard());
        priceHtml = `<span class="price-lg" id="price">${money(p.price)}</span>`;
        fields = nameFields();
      } else if (id === "custom") {
        preview = card(customCard());
        priceHtml = `<span class="price-lg" id="price">${money(customPrice())}</span>`;
        fields = nameFields() + colorField() + finishField() + logoField("Shown in the top-left corner. Use a PNG or SVG with a transparent background.");
      } else {
        preview = stack(packCard());
        priceHtml = `<span class="price-lg"><span id="price">${money(packPrice())}</span><small id="per">${perCard()}</small></span>`;
        fields = `
          ${PACKS.length < 2 ? "" : `<div class="field"><span class="flabel">Pack size</span>
            <div class="seg" id="packSeg">${PACKS.map(k => `<button type="button" data-size="${k.size}" aria-pressed="${k.size === draft.packSize}">${k.size} cards<small>${money(k.price)}</small></button>`).join("")}</div>
          </div>`}
          <div class="field"><label for="f-company">Company name</label><input type="text" id="f-company" maxlength="30" value="${esc(draft.company)}"></div>
          <div class="field"><label for="f-team">Team names <span id="teamCount"></span></label><textarea id="f-team" rows="5">${esc(draft.team)}</textarea></div>
          ${colorField()}${finishField()}${logoField("Printed on every card in the pack.")}`;
      }
      facts = `<dl class="facts">
        <div><dt>Size</dt><dd>85.6 × 54 mm (ISO ID-1)</dd></div>
        <div><dt>Weight</dt><dd>${p.weight}</dd></div>
        <div><dt>Ships in</dt><dd>3 to 5 business days</dd></div>
      </dl>`;
      const backO = id === "onyx" ? onyxCard() : id === "custom" ? customCard() : packCard();
      return `
      <div class="wrap crumbs"><a href="#shop">Shop</a><span aria-hidden="true">/</span><span>${p.name}</span></div>
      <section class="wrap pdp">
        <div class="viewer v-${id}" id="viewer" style="--pick:${draft.color}">
          <div class="tilt" id="tilt">
            <div class="flip" id="flip" style="view-transition-name:card-${id}">
              <div class="face front" id="front">${preview}</div>
              <div class="face back" id="back">${card({ ...backO, back: true })}</div>
            </div>
          </div>
          <div class="tools"><button type="button" class="chip-btn" id="flipBtn">Show back</button></div>
        </div>
        <div class="buy">
          <span class="label">${p.kicker}</span>
          <h1>${p.name}</h1>
          ${priceHtml}
          <p class="desc">${p.blurb}</p>
          ${fields}
          <div class="buy-row">
            ${id === "pack" ? "" : `<div class="qty"><button type="button" id="q-dec" aria-label="Decrease quantity">&minus;</button><output id="q-val">1</output><button type="button" id="q-inc" aria-label="Increase quantity">+</button></div>`}
            <button class="btn primary" id="add" type="button">Add to cart</button>
          </div>
          ${facts}
        </div>
      </section>`;
    },

    cart() {
      if (!cart.length) return `
        <section class="wrap page-head"><h1>Cart</h1></section>
        <section class="wrap empty"><p>Your cart is empty. Pick a card to get started.</p><a class="btn primary" href="#shop">Shop cards ${ARROW}</a></section>`;
      const sub = cart.reduce((s, l) => s + l.unit * l.qty, 0);
      const FREE = 75, ship = sub >= FREE ? 0 : 6;
      return `
      <section class="wrap page-head"><span class="label">${cart.reduce((s, l) => s + l.qty, 0)} items</span><h1>Cart</h1></section>
      <section class="wrap cart">
        <div>
          ${cart.map((l, i) => {
            const vis = l.id === "pack" ? stack(l.card) : card(l.card);
            return `
            <div class="line">
              ${vis}
              <div><h3>${PRODUCTS[l.id].name}</h3><div class="sub">${esc(l.desc)}</div></div>
              <div class="right">
                <span class="amt">${money(l.unit * l.qty)}</span>
                <div class="qty"><button type="button" data-dec="${i}" aria-label="Decrease">&minus;</button><output>${l.qty}</output><button type="button" data-inc="${i}" aria-label="Increase">+</button></div>
                <button class="link-btn" type="button" data-rm="${i}">Remove</button>
              </div>
            </div>`; }).join("")}
        </div>
        <aside class="summary">
          <h3>Order summary</h3>
          <div class="row"><span>Subtotal</span><span>${money(sub)}</span></div>
          <div class="row"><span>Shipping</span><span>${ship ? money(ship) : "Free"}</span></div>
          <div class="meter" aria-hidden="true"><i style="width:${Math.min(100, sub / FREE * 100)}%"></i></div>
          <div class="row total"><span>Total</span><span>${money(sub + ship)}</span></div>
          <button class="btn primary full" type="button" id="checkout" style="margin-top:18px">Checkout ${ARROW}</button>
          <p class="note">${ship ? `Add ${money(FREE - sub)} more for free shipping.` : "Your order ships free."} Checkout is a demo and no payment is taken.</p>
        </aside>
      </section>`;
    },
  };

  function nameFields() {
    return `<div class="two">
      <div class="field"><label for="f-name">Name on card</label><input type="text" id="f-name" maxlength="28" value="${esc(draft.name)}"></div>
      <div class="field"><label for="f-role">Title</label><input type="text" id="f-role" maxlength="32" value="${esc(draft.role)}"></div>
    </div>`;
  }
  function colorField() {
    return `<div class="field"><span class="flabel">Card color <span id="colorHex">${draft.color.toUpperCase()}</span></span>
      <div class="swatches" id="swatches">
        ${COLORS.map(c => `<button type="button" class="swatch" style="--sw:${c}" data-color="${c}" aria-label="Color ${c}" aria-pressed="${c === draft.color}"></button>`).join("")}
        <span class="swatch picker" title="Pick any color"><input type="color" id="f-color" value="${draft.color}" aria-label="Pick any color"></span>
      </div></div>`;
  }
  function finishField() {
    return `<div class="field"><span class="flabel">Finish</span>
      <div class="seg" id="finishSeg">${Object.entries(FINISHES).map(([k, f]) => `<button type="button" data-finish="${k}" aria-pressed="${k === draft.finish}">${f.label}<small>${f.add ? "+" + money(f.add) : "Included"}</small></button>`).join("")}</div></div>`;
  }
  function logoField(help) {
    return `<div class="field"><span class="flabel">Logo <span>Optional</span></span>
      <div class="upload" id="drop">
        <div class="thumb" id="thumb">${draft.logo ? `<img src="${draft.logo}" alt="">` : "+"}</div>
        <div class="txt"><b id="logoName">${draft.logo ? esc(draft.logoName) : "Upload a logo"}</b><span>${help}</span></div>
        <label for="f-logo">${draft.logo ? "Replace" : "Choose file"}</label><input type="file" id="f-logo" accept="image/*">
      </div></div>`;
  }
  const customPrice = () => PRODUCTS.custom.price + FINISHES[draft.finish].add;
  const packInfo = () => PACKS.find(k => k.size === draft.packSize) || PACKS[0];
  const packPrice = () => packInfo().price + FINISHES[draft.finish].add;
  const perCard = () => `${money(packPrice() / packInfo().size)} per card`;

  const view = document.getElementById("view");
  const countEl = document.getElementById("cartCount");
  const toastEl = document.getElementById("toast");
  const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  let toastTimer;

  function updateCount(bump) {
    countEl.textContent = cart.reduce((s, l) => s + l.qty, 0);
    if (bump) { countEl.classList.add("bump"); setTimeout(() => countEl.classList.remove("bump"), 260); }
  }
  function toast(html) {
    toastEl.innerHTML = html; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2800);
  }

  function parse() {
    const h = location.hash.slice(1);
    if (h.startsWith("card-")) return { name: "product", arg: h.slice(5) };
    return { name: views[h] ? h : "home" };
  }
  function render() {
    const r = parse();
    view.innerHTML = r.name === "product" ? views.product(r.arg) : views[r.name]();
    const active = r.name === "product" ? "shop" : r.name;
    document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    wire(r);
  }
  let first = true;
  function go() {
    const top = () => window.scrollTo({ top: 0, behavior: "instant" });
    if (first) { first = false; render(); return; }
    if (document.startViewTransition && !reduced()) document.startViewTransition(() => { render(); top(); }).ready.catch(() => {});
    else { render(); top(); view.classList.remove("fallback-in"); void view.offsetWidth; view.classList.add("fallback-in"); }
  }

  function wire(r) {
    if (r.name === "product" && PRODUCTS[r.arg]) wireProduct(r.arg);
    if (r.name === "cart") wireCart();
  }

  function wireProduct(id) {
    const viewer = document.getElementById("viewer"), tilt = document.getElementById("tilt"), flip = document.getElementById("flip");
    const front = document.getElementById("front"), back = document.getElementById("back");
    const $ = s => document.getElementById(s);

    viewer.addEventListener("pointermove", e => {
      if (reduced() || e.pointerType === "touch") return;
      const b = viewer.getBoundingClientRect();
      const x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5;
      tilt.style.transition = "transform .12s linear";
      tilt.style.transform = `rotateY(${x * 20}deg) rotateX(${-y * 16}deg)`;
    });
    viewer.addEventListener("pointerleave", () => { tilt.style.transition = ""; tilt.style.transform = ""; });
    $("flipBtn").onclick = () => { const f = flip.classList.toggle("flipped"); $("flipBtn").textContent = f ? "Show front" : "Show back"; };

    const cardObj = () => id === "onyx" ? onyxCard() : id === "custom" ? customCard() : packCard();
    const refresh = () => {
      const o = cardObj();
      front.innerHTML = id === "pack" ? stack(o) : card(o);
      back.innerHTML = card({ ...o, back: true });
      viewer.style.setProperty("--pick", draft.color);
      if ($("price")) $("price").textContent = money(id === "onyx" ? PRODUCTS.onyx.price : id === "custom" ? customPrice() : packPrice());
      if ($("per")) $("per").textContent = perCard();
      if ($("teamCount")) {
        const n = teamNames().length, s = draft.packSize;
        $("teamCount").textContent = n > s ? `${n} names, but the pack has ${s} cards` : `${n} of ${s} named${n < s ? ", the rest print blank" : ""}`;
      }
    };
    const bind = (elId, key) => { const el = $(elId); if (el) el.addEventListener("input", () => { draft[key] = el.value; refresh(); }); };
    bind("f-name", "name"); bind("f-role", "role"); bind("f-company", "company"); bind("f-team", "team");

    const sw = $("swatches");
    const setColor = c => {
      draft.color = c;
      sw.querySelectorAll("[data-color]").forEach(b => b.setAttribute("aria-pressed", b.dataset.color === c));
      $("colorHex").textContent = c.toUpperCase();
      refresh();
    };
    if (sw) {
      sw.querySelectorAll("[data-color]").forEach(b => b.onclick = () => { setColor(b.dataset.color); $("f-color").value = b.dataset.color; });
      $("f-color").addEventListener("input", e => setColor(e.target.value));
    }
    const seg = (segId, attr, key, cast = v => v) => {
      const el = $(segId); if (!el) return;
      el.querySelectorAll("button").forEach(b => b.onclick = () => {
        draft[key] = cast(b.dataset[attr]);
        el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
        refresh();
      });
    };
    seg("finishSeg", "finish", "finish");
    seg("packSeg", "size", "packSize", Number);

    const drop = $("drop");
    if (drop) {
      const take = file => {
        if (!file || !file.type.startsWith("image/")) { toast("Choose an image file, such as a PNG, JPG or SVG."); return; }
        if (file.size > 2e6) { toast("That logo is over 2 MB. Choose a smaller file."); return; }
        const rd = new FileReader();
        rd.onload = () => {
          draft.logo = rd.result; draft.logoName = file.name;
          $("thumb").innerHTML = `<img src="${draft.logo}" alt="">`;
          $("logoName").textContent = file.name;
          drop.querySelector("label").textContent = "Replace";
          refresh();
        };
        rd.readAsDataURL(file);
      };
      $("f-logo").addEventListener("change", e => take(e.target.files[0]));
      ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
      ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
      drop.addEventListener("drop", e => take(e.dataTransfer.files[0]));
    }

    let q = 1;
    if ($("q-val")) {
      $("q-dec").onclick = () => { q = Math.max(1, q - 1); $("q-val").textContent = q; };
      $("q-inc").onclick = () => { q = Math.min(50, q + 1); $("q-val").textContent = q; };
    }
    $("add").onclick = () => {
      const o = cardObj();
      let unit, desc;
      if (id === "onyx") { unit = PRODUCTS.onyx.price; desc = `${draft.name} · ${draft.role}`; }
      else if (id === "custom") { unit = customPrice(); desc = `${draft.name} · ${FINISHES[draft.finish].label} · ${draft.color.toUpperCase()}${draft.logo ? " · Logo" : ""}`; }
      else { unit = packPrice(); q = 1; desc = `${draft.packSize} cards · ${draft.company} · ${teamNames().length} names · ${FINISHES[draft.finish].label}`; }
      const key = JSON.stringify([id, desc, o.logo || ""]);
      const hit = cart.find(l => l.key === key);
      hit ? hit.qty += q : cart.push({ key, id, unit, desc, qty: q, card: o });
      save(); updateCount(true);
      toast(`Added ${id === "pack" ? "Business Pack" : q + " × " + PRODUCTS[id].name} <a href="#cart">View cart</a>`);
    };
    refresh();
  }

  function wireCart() {
    view.querySelectorAll("[data-inc],[data-dec],[data-rm]").forEach(b => b.addEventListener("click", () => {
      const i = +(b.dataset.inc ?? b.dataset.dec ?? b.dataset.rm);
      if (b.dataset.inc != null) cart[i].qty = Math.min(50, cart[i].qty + 1);
      else if (b.dataset.dec != null) cart[i].qty > 1 ? cart[i].qty-- : cart.splice(i, 1);
      else cart.splice(i, 1);
      save(); updateCount();
      document.startViewTransition && !reduced() ? document.startViewTransition(render).ready.catch(() => {}) : render();
    }));
    const co = document.getElementById("checkout");
    if (co) co.onclick = () => toast("Checkout is coming soon. This is a demo store.");
  }

  window.addEventListener("hashchange", go);
  updateCount();
  go();
})();
</script>
