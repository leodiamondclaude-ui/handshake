<title>Handshake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one sticky header, a single routed <main> whose views cross-fade and morph the card between pages. */
:root {
  --paper: #eef0f3;
  --surface: #ffffff;
  --ink: #12151b;
  --muted: #5b6370;
  --line: #d6dae1;
  --signal: #2343ff;
  --signal-ink: #ffffff;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d0f13; --surface: #161a21; --ink: #eceef2; --muted: #98a0ad;
    --line: #262b35; --signal: #5b74ff; --signal-ink: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d0f13; --surface: #161a21; --ink: #eceef2; --muted: #98a0ad;
  --line: #262b35; --signal: #5b74ff; --signal-ink: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.label { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); view-transition-name: top; }
.top .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
.logo { font: 800 22px/1 var(--display); text-decoration: none; letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px; }
.logo svg { width: 22px; height: 22px; }
nav.links { display: flex; gap: 4px; margin-left: auto; }
nav.links a { text-decoration: none; font-weight: 500; padding: 8px 12px; border-radius: 999px; color: var(--muted); transition: color .2s, background .2s; }
nav.links a:hover { color: var(--ink); }
nav.links a[aria-current="page"] { color: var(--ink); background: var(--surface); }
.cart-btn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 600; text-decoration: none; }
.cart-btn .count { font: 500 12px/1 var(--mono); background: var(--ink); color: var(--paper); border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 6px; transition: transform .3s var(--ease); }
.cart-btn .count.bump { transform: scale(1.35); }
@media (max-width: 640px) { nav.links a.hide-sm { display: none; } .top .wrap { gap: 12px; } }

/* View transitions */
main { min-height: 70vh; }
::view-transition-old(root) { animation: vt-out .22s var(--ease) both; }
::view-transition-new(root) { animation: vt-in .38s var(--ease) both; }
::view-transition-group(*) { animation-duration: .5s; animation-timing-function: var(--ease); }
@keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }
.fallback-in { animation: vt-in .38s var(--ease) both; }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  .fallback-in, .rings span { animation: none !important; }
}

/* The card itself */
.card { --w: 340px; width: min(var(--w), 100%); aspect-ratio: 85.6 / 53.98; border-radius: 16px; position: relative; overflow: hidden; color: var(--c-ink); background: var(--c-bg); box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 30px 60px -30px rgba(10,14,30,.55), 0 12px 24px -16px rgba(10,14,30,.35); padding: 7% 7.5%; display: flex; flex-direction: column; justify-content: space-between; transform-style: preserve-3d; transition: transform .5s var(--ease); max-width: 100%; }
.card::after { content: ""; position: absolute; inset: 0; background: var(--c-sheen); mix-blend-mode: overlay; pointer-events: none; }
.card .c-top { display: flex; justify-content: space-between; align-items: flex-start; }
.card .c-mark { font: 800 1.05em/1 var(--display); letter-spacing: -0.03em; }
.card .c-wave { width: 1.6em; height: 1.6em; opacity: .85; }
.card .c-name { font: 700 1.35em/1.05 var(--display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
.card .c-role { font: 500 .62em/1.3 var(--mono); letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-top: .4em; }
.card[data-finish="onyx"]  { --c-bg: linear-gradient(140deg,#1b1d22,#0b0c0f 60%,#202329); --c-ink: #e9ebef; --c-sheen: radial-gradient(120% 80% at 10% 0%, rgba(255,255,255,.12), transparent 55%); }
.card[data-finish="steel"] { --c-bg: repeating-linear-gradient(90deg, #b9bec6 0 1px, #c9cdd4 1px 3px), #c3c8cf; --c-ink: #1a1d22; --c-sheen: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 45%, transparent 60%); }
.card[data-finish="bamboo"]{ --c-bg: repeating-linear-gradient(8deg, #c99a5b 0 6px, #c08f50 6px 9px, #cfa265 9px 16px); --c-ink: #2b1c0c; --c-sheen: radial-gradient(90% 70% at 80% 10%, rgba(255,240,210,.35), transparent 60%); }
.card[data-finish="frost"] { --c-bg: linear-gradient(135deg, rgba(220,230,245,.92), rgba(190,205,230,.75)); --c-ink: #0f1a33; --c-sheen: radial-gradient(100% 90% at 0% 0%, rgba(255,255,255,.7), transparent 50%); }
.card[data-finish="signal"]{ --c-bg: linear-gradient(150deg, #2a49ff, #1530d8 70%, #3b58ff); --c-ink: #ffffff; --c-sheen: radial-gradient(110% 80% at 15% 0%, rgba(255,255,255,.28), transparent 55%); }

/* Home */
.hero { padding-block: clamp(40px, 8vw, 96px) 48px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; }
.hero > * { min-width: 0; }
.hero h1 { font-size: clamp(44px, 7.4vw, 96px); font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--signal); }
.hero p.lede { font-size: 19px; color: var(--muted); max-width: 46ch; margin: 22px 0 30px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 14px 22px; font-weight: 600; text-decoration: none; border: 1px solid transparent; transition: transform .25s var(--ease), background .2s, box-shadow .25s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--signal); color: var(--signal-ink); box-shadow: 0 10px 24px -12px var(--signal); }
.btn.primary:hover { transform: translateY(-2px); }
.btn.ghost { border-color: var(--line); background: var(--surface); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.full { width: 100%; }
.stage { position: relative; display: grid; place-items: center; padding: 40px 0; perspective: 1200px; }
.stage .phone { position: absolute; right: 0; top: 50%; width: 38%; max-width: 150px; aspect-ratio: 9/19; border-radius: 26px; border: 2px solid var(--ink); background: var(--surface); transform: translateY(-50%) rotate(8deg); display: grid; place-items: center; opacity: .95; }
.stage .phone::before { content: ""; position: absolute; top: 8px; width: 34%; height: 6px; border-radius: 6px; background: var(--ink); opacity: .85; }
.stage .phone .ok { font: 500 10px/1.4 var(--mono); text-align: center; color: var(--muted); padding: 0 10px; }
.stage .phone .ok b { display: block; font: 700 15px/1.1 var(--display); color: var(--ink); margin-bottom: 4px; letter-spacing: -0.01em; }
.stage .card { --w: 360px; transform: rotateY(-14deg) rotateX(8deg) translateX(-24%); z-index: 1; }
.rings { position: absolute; right: 32%; top: 50%; transform: translate(50%,-50%); width: 1px; height: 1px; z-index: 2; pointer-events: none; }
.rings span { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border: 2px solid var(--signal); border-radius: 50%; opacity: 0; animation: ring 2.6s var(--ease) infinite; }
.rings span:nth-child(2) { animation-delay: .5s; } .rings span:nth-child(3) { animation-delay: 1s; }
@keyframes ring { 0% { transform: scale(.4); opacity: .8; } 100% { transform: scale(2.2); opacity: 0; } }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .stage { order: -1; } }

.specs { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line); }
.specs div { padding: 22px 20px; border-left: 1px solid var(--line); min-width: 0; }
.specs div:first-child { border-left: 0; padding-left: 0; }
.specs b { display: block; font: 700 26px/1.1 var(--display); letter-spacing: -0.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .specs { grid-template-columns: 1fr 1fr; } .specs div:nth-child(3) { border-left: 0; padding-left: 0; } .specs div:nth-child(n+3) { border-top: 1px solid var(--line); } }

.section { padding-block: 72px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(30px, 4vw, 46px); font-weight: 700; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; min-width: 0; }
.step .n { font: 500 12px/1 var(--mono); color: var(--signal); }
.step h3 { font-size: 22px; margin: 14px 0 8px; }
.step p { color: var(--muted); margin: 0; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }

/* Shop grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
.tile { text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 18px; transition: border-color .25s, transform .35s var(--ease); min-width: 0; }
.tile:hover { border-color: var(--ink); transform: translateY(-3px); }
.tile .shot { background: var(--paper); border-radius: 14px; padding: 28px 18px; display: grid; place-items: center; }
.tile .card { --w: 240px; font-size: 11px; }
.tile:hover .card { transform: rotate(-3deg) scale(1.03); }
.tile .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tile h3 { font-size: 20px; }
.tile .price { font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
.tile p { margin: 0; color: var(--muted); font-size: 14px; }
.page-head { padding-block: 48px 28px; }
.page-head h1 { font-size: clamp(40px, 6vw, 72px); font-weight: 800; margin-top: 12px; }

/* Product */
.crumbs { padding-block: 24px 0; font-size: 14px; color: var(--muted); }
.crumbs a { text-decoration: none; } .crumbs a:hover { color: var(--ink); }
.pdp { display: grid; grid-template-columns: 1.15fr .85fr; gap: 48px; padding-block: 24px 80px; align-items: start; }
.pdp > * { min-width: 0; }
.viewer { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(28px, 6vw, 72px) 24px; display: grid; place-items: center; perspective: 1200px; gap: 22px; }
.viewer .card { --w: 440px; font-size: clamp(11px, 2.6vw, 18px); }
.viewer .hint { font-size: 13px; color: var(--muted); }
.buy h1 { font-size: clamp(36px, 4.4vw, 54px); font-weight: 800; margin: 10px 0 8px; }
.buy .price-lg { font: 500 22px/1 var(--mono); font-variant-numeric: tabular-nums; }
.buy .desc { color: var(--muted); margin: 18px 0 28px; }
.field { display: grid; gap: 8px; margin-bottom: 20px; }
.field label, .field .label { font-weight: 600; font-size: 14px; font-family: var(--body); letter-spacing: 0; text-transform: none; color: var(--ink); }
.field input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; transition: border-color .2s; }
.field input:focus { outline: none; border-color: var(--signal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--signal) 22%, transparent); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); padding: 3px; background: var(--surface); transition: border-color .2s, transform .2s var(--ease); }
.swatch:hover { transform: scale(1.08); }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.swatch i { display: block; width: 100%; height: 100%; border-radius: 50%; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.qty button { width: 42px; height: 42px; border: 0; background: none; font-size: 18px; border-radius: 999px; }
.qty output { min-width: 32px; text-align: center; font: 500 15px/1 var(--mono); font-variant-numeric: tabular-nums; }
.buy-row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
.buy-row .btn { flex: 1; }
.facts { margin-top: 32px; border-top: 1px solid var(--line); }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.facts dt { color: var(--muted); } .facts dd { margin: 0; text-align: right; font-family: var(--mono); font-size: 13px; }
@media (max-width: 860px) { .pdp { grid-template-columns: 1fr; } .viewer { position: static; } }

/* Cart */
.cart { display: grid; grid-template-columns: 1fr 360px; gap: 40px; padding-block: 8px 80px; align-items: start; }
.cart > * { min-width: 0; }
.line { display: grid; grid-template-columns: 120px 1fr auto; gap: 20px; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); }
.line > * { min-width: 0; }
.line .card { --w: 120px; font-size: 6px; border-radius: 7px; }
.line h3 { font-size: 18px; }
.line .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.line .right { display: grid; justify-items: end; gap: 8px; }
.link-btn { border: 0; background: none; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 0; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px); }
.summary .row { display: flex; justify-content: space-between; padding: 8px 0; font-variant-numeric: tabular-nums; }
.summary .row.total { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 16px; font-weight: 600; font-size: 18px; }
.summary .note { font-size: 13px; color: var(--muted); margin: 14px 0 0; }
.empty { text-align: center; padding-block: 80px; display: grid; justify-items: center; gap: 16px; }
.empty p { color: var(--muted); margin: 0; }
@media (max-width: 860px) { .cart { grid-template-columns: 1fr; } .summary { position: static; } .line { grid-template-columns: 84px 1fr; } .line .card { --w: 84px; font-size: 4.2px; } .line .right { grid-column: 1 / -1; grid-auto-flow: column; justify-content: space-between; align-items: center; } }

/* Toast + footer */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, calc(100% + 48px)); visibility: hidden; background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 999px; font-weight: 500; transition: transform .45s var(--ease); z-index: 30; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast { transition: transform .45s var(--ease), visibility .45s; }
.toast a { color: inherit; font-weight: 600; }
footer { border-top: 1px solid var(--line); padding-block: 32px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
</style>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="Handshake home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 0 7"/><path d="M10 6a10 10 0 0 1 0 12" stroke="var(--signal)"/><path d="M14 3.5a14 14 0 0 1 0 17"/></svg>
      Handshake
    </a>
    <nav class="links" aria-label="Main">
      <a href="#home" data-nav="home" class="hide-sm">Home</a>
      <a href="#shop" data-nav="shop">Shop</a>
    </nav>
    <a class="cart-btn" href="#cart" aria-label="Cart">Cart <span class="count" id="cartCount">0</span></a>
  </div>
</header>

<main id="view"></main>

<footer>
  <div class="wrap">
    <span>Handshake NFC cards. Demo storefront, no real orders are placed.</span>
    <span>Works with iPhone XS and newer, and most NFC-enabled Android phones.</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const PRODUCTS = [
    { id: "onyx",   name: "Onyx",   price: 39, finish: "onyx",   material: "Matte black PVC",       blurb: "Soft-touch matte black with a quiet sheen. The everyday card.", weight: "5 g" },
    { id: "steel",  name: "Steel",  price: 89, finish: "steel",  material: "Brushed stainless steel", blurb: "Laser-engraved brushed steel. Heavy in the hand, impossible to forget.", weight: "18 g" },
    { id: "bamboo", name: "Bamboo", price: 49, finish: "bamboo", material: "Sustainable bamboo",    blurb: "Real bamboo veneer, laser-etched. Every grain is a little different.", weight: "4 g" },
    { id: "frost",  name: "Frost",  price: 45, finish: "frost",  material: "Frosted clear PVC",     blurb: "Translucent frosted finish with a printed face. Light and modern.", weight: "5 g" },
    { id: "signal", name: "Signal", price: 42, finish: "signal", material: "Gloss PVC, cobalt",     blurb: "Our signature cobalt. Hard to lose in a stack of white cards.", weight: "5 g" },
  ];
  const byId = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));
  const money = n => "$" + n.toFixed(2);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const WAVE = '<svg class="c-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 8.5a6 6 0 0 1 0 7"/><path d="M10 6a10 10 0 0 1 0 12"/><path d="M14 3.5a14 14 0 0 1 0 17"/></svg>';

  let cart = [];
  try { cart = JSON.parse(localStorage.getItem("handshake-cart") || "[]"); } catch (e) { cart = []; }
  const save = () => { try { localStorage.setItem("handshake-cart", JSON.stringify(cart)); } catch (e) {} };
  const draft = { name: "Alex Rivera", role: "Product Designer" };

  const card = (finish, name, role, vt) =>
    `<div class="card" data-finish="${finish}"${vt ? ` style="view-transition-name:${vt}"` : ""} role="img" aria-label="${esc(name)} card preview, ${finish} finish">
      <div class="c-top"><span class="c-mark">Handshake</span>${WAVE}</div>
      <div><div class="c-name">${esc(name)}</div><div class="c-role">${esc(role)}</div></div>
    </div>`;

  const views = {
    home() {
      return `
      <section class="wrap hero">
        <div>
          <span class="label">NFC business cards</span>
          <h1 style="margin-top:16px">One tap.<br><em>Every</em> link.</h1>
          <p class="lede">Hold a Handshake card to any modern phone and your contact, socials and portfolio open instantly. No app needed on their end. Update your details any time without reprinting.</p>
          <div class="actions">
            <a class="btn primary" href="#shop">Shop cards</a>
            <a class="btn ghost" href="#card-steel">See the Steel card</a>
          </div>
        </div>
        <div class="stage">
          ${card("signal", draft.name, draft.role, "card-signal")}
          <div class="rings" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="phone" aria-hidden="true"><div class="ok"><b>Alex Rivera</b>Save contact<br>Portfolio<br>LinkedIn</div></div>
        </div>
      </section>
      <section class="wrap">
        <div class="specs">
          <div><span class="label">Chip</span><b>NTAG216</b></div>
          <div><span class="label">Memory</span><b>888 bytes</b></div>
          <div><span class="label">Tap range</span><b>1 to 4 cm</b></div>
          <div><span class="label">Rated for</span><b>100k taps</b></div>
        </div>
      </section>
      <section class="wrap section">
        <div class="section-head"><h2>How it works</h2><a class="btn ghost" href="#shop">Browse finishes</a></div>
        <div class="steps">
          <div class="step"><span class="n">Step 1</span><h3>Pick a finish</h3><p>Five materials, from matte PVC to brushed steel. Add your name and title for the front.</p></div>
          <div class="step"><span class="n">Step 2</span><h3>Set up your profile</h3><p>When your card arrives, link it to a profile page with your contact, socials and files.</p></div>
          <div class="step"><span class="n">Step 3</span><h3>Tap to share</h3><p>Hold the card near the top of any NFC phone. Your profile opens in their browser.</p></div>
        </div>
      </section>`;
    },
    shop() {
      return `
      <section class="wrap page-head"><span class="label">${PRODUCTS.length} finishes</span><h1>Shop cards</h1></section>
      <section class="wrap" style="padding-bottom:80px">
        <div class="grid">
          ${PRODUCTS.map(p => `
            <a class="tile" href="#card-${p.id}">
              <div class="shot">${card(p.finish, draft.name, draft.role, "card-" + p.id)}</div>
              <div class="meta"><h3>${p.name}</h3><span class="price">${money(p.price)}</span></div>
              <p>${p.material}</p>
            </a>`).join("")}
        </div>
      </section>`;
    },
    product(id) {
      const p = byId[id]; if (!p) return views.shop();
      return `
      <div class="wrap crumbs"><a href="#shop">Shop</a> / ${p.name}</div>
      <section class="wrap pdp">
        <div class="viewer" id="viewer">
          ${card(p.finish, draft.name, draft.role, "card-" + p.id)}
          <span class="hint">Move your pointer over the card to tilt it</span>
        </div>
        <div class="buy">
          <span class="label">${p.material}</span>
          <h1>${p.name}</h1>
          <span class="price-lg">${money(p.price)}</span>
          <p class="desc">${p.blurb}</p>
          <div class="field"><label for="f-name">Name on card</label><input id="f-name" maxlength="28" value="${esc(draft.name)}"></div>
          <div class="field"><label for="f-role">Title</label><input id="f-role" maxlength="32" value="${esc(draft.role)}"></div>
          <div class="field">
            <span class="label">Other finishes</span>
            <div class="swatches">
              ${PRODUCTS.map(o => `<a class="swatch" href="#card-${o.id}" aria-label="${o.name}" aria-pressed="${o.id === p.id}"><i class="card" data-finish="${o.finish}" style="padding:0;border-radius:50%;box-shadow:none"></i></a>`).join("")}
            </div>
          </div>
          <div class="buy-row">
            <div class="qty"><button type="button" id="q-dec" aria-label="Decrease quantity">&minus;</button><output id="q-val">1</output><button type="button" id="q-inc" aria-label="Increase quantity">+</button></div>
            <button class="btn primary" id="add" type="button">Add to cart</button>
          </div>
          <dl class="facts">
            <div><dt>Chip</dt><dd>NTAG216, 888 bytes</dd></div>
            <div><dt>Size</dt><dd>85.6 × 54 mm (ISO ID-1)</dd></div>
            <div><dt>Weight</dt><dd>${p.weight}</dd></div>
            <div><dt>Ships in</dt><dd>3 to 5 business days</dd></div>
          </dl>
        </div>
      </section>`;
    },
    cart() {
      if (!cart.length) return `
        <section class="wrap page-head"><h1>Cart</h1></section>
        <section class="wrap empty"><p>Your cart is empty. Pick a finish to get started.</p><a class="btn primary" href="#shop">Shop cards</a></section>`;
      const sub = cart.reduce((s, l) => s + byId[l.id].price * l.qty, 0);
      const ship = sub >= 75 ? 0 : 6;
      return `
      <section class="wrap page-head"><span class="label">${cart.reduce((s,l)=>s+l.qty,0)} items</span><h1>Cart</h1></section>
      <section class="wrap cart">
        <div>
          ${cart.map((l, i) => { const p = byId[l.id]; return `
            <div class="line">
              ${card(p.finish, l.name, l.role)}
              <div><h3>${p.name}</h3><div class="sub">${esc(l.name)} · ${esc(l.role)}</div></div>
              <div class="right">
                <span style="font-family:var(--mono)">${money(p.price * l.qty)}</span>
                <div class="qty"><button type="button" data-dec="${i}" aria-label="Decrease">&minus;</button><output>${l.qty}</output><button type="button" data-inc="${i}" aria-label="Increase">+</button></div>
                <button class="link-btn" type="button" data-rm="${i}">Remove</button>
              </div>
            </div>`; }).join("")}
        </div>
        <aside class="summary">
          <div class="row"><span>Subtotal</span><span>${money(sub)}</span></div>
          <div class="row"><span>Shipping</span><span>${ship ? money(ship) : "Free"}</span></div>
          <div class="row total"><span>Total</span><span>${money(sub + ship)}</span></div>
          <button class="btn primary full" type="button" id="checkout" style="margin-top:16px">Checkout</button>
          <p class="note">${ship ? `Add ${money(75 - sub)} more for free shipping.` : "You get free shipping."} Checkout is a demo and no payment is taken.</p>
        </aside>
      </section>`;
    },
  };

  const view = document.getElementById("view");
  const countEl = document.getElementById("cartCount");
  const toastEl = document.getElementById("toast");
  let toastTimer;

  function updateCount(bump) {
    countEl.textContent = cart.reduce((s, l) => s + l.qty, 0);
    if (bump) { countEl.classList.add("bump"); setTimeout(() => countEl.classList.remove("bump"), 250); }
  }
  function toast(html) {
    toastEl.innerHTML = html; toastEl.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  function parse() {
    const h = location.hash.slice(1);
    if (h.startsWith("card-")) return { name: "product", arg: h.slice(5) };
    return { name: views[h] ? h : "home" };
  }

  function render() {
    const r = parse();
    view.innerHTML = r.name === "product" ? views.product(r.arg) : views[r.name]();
    const active = r.name === "product" ? "shop" : r.name;
    document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === active ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    wire(r);
  }

  let first = true;
  function go() {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const scrollTop = () => window.scrollTo({ top: 0, behavior: "instant" });
    if (first) { first = false; render(); return; }
    if (document.startViewTransition && !reduce) {
      document.startViewTransition(() => { render(); scrollTop(); });
    } else {
      render(); scrollTop();
      view.classList.remove("fallback-in"); void view.offsetWidth; view.classList.add("fallback-in");
    }
  }

  function wire(r) {
    if (r.name === "product" && byId[r.arg]) {
      const p = byId[r.arg];
      const viewer = document.getElementById("viewer");
      const c = viewer.querySelector(".card");
      const nameEl = c.querySelector(".c-name"), roleEl = c.querySelector(".c-role");
      viewer.addEventListener("pointermove", e => {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const b = viewer.getBoundingClientRect();
        const x = (e.clientX - b.left) / b.width - .5, y = (e.clientY - b.top) / b.height - .5;
        c.style.transition = "transform .12s linear";
        c.style.transform = `rotateY(${x * 22}deg) rotateX(${-y * 18}deg)`;
      });
      viewer.addEventListener("pointerleave", () => { c.style.transition = ""; c.style.transform = ""; });
      const fn = document.getElementById("f-name"), fr = document.getElementById("f-role");
      fn.addEventListener("input", () => { draft.name = fn.value || " "; nameEl.textContent = fn.value || "Your name"; });
      fr.addEventListener("input", () => { draft.role = fr.value || " "; roleEl.textContent = fr.value || "Your title"; });
      let q = 1; const qv = document.getElementById("q-val");
      document.getElementById("q-dec").onclick = () => { q = Math.max(1, q - 1); qv.textContent = q; };
      document.getElementById("q-inc").onclick = () => { q = Math.min(50, q + 1); qv.textContent = q; };
      document.getElementById("add").onclick = () => {
        const name = fn.value.trim() || "Your name", role = fr.value.trim() || "Your title";
        const hit = cart.find(l => l.id === p.id && l.name === name && l.role === role);
        hit ? hit.qty += q : cart.push({ id: p.id, name, role, qty: q });
        save(); updateCount(true);
        toast(`Added ${q} × ${p.name} <a href="#cart">View cart</a>`);
      };
    }
    if (r.name === "cart") {
      view.querySelectorAll("[data-inc],[data-dec],[data-rm]").forEach(b => b.addEventListener("click", () => {
        const i = +(b.dataset.inc ?? b.dataset.dec ?? b.dataset.rm);
        if (b.dataset.inc != null) cart[i].qty = Math.min(50, cart[i].qty + 1);
        else if (b.dataset.dec != null) cart[i].qty > 1 ? cart[i].qty-- : cart.splice(i, 1);
        else cart.splice(i, 1);
        save(); updateCount();
        const swap = () => render();
        document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches ? document.startViewTransition(swap) : swap();
      }));
      const co = document.getElementById("checkout");
      if (co) co.onclick = () => toast("Checkout is coming soon. This is a demo store.");
    }
  }

  window.addEventListener("hashchange", go);
  updateCount();
  go();
})();
</script>
